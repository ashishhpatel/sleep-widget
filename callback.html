<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oura Connection</title><style>body{font:16px system-ui,sans-serif;max-width:680px;margin:50px auto;padding:0 22px;color:#15263c}.box{background:#eef4fa;border-radius:14px;padding:20px}button{padding:12px 18px;background:#1c5a8a;color:white;border:0;border-radius:8px}textarea{width:100%;box-sizing:border-box;height:85px;margin:10px 0}small{color:#556}</style></head><body><h1>Oura Connection</h1><div class="box" id="status">Waiting for Oura authorization.</div><div id="result" hidden><p>Authorization succeeded. Your access token is shown only in this browser tab. Keep it private.</p><textarea id="token" readonly aria-label="Private access token"></textarea><button id="copy">Copy token</button><p id="expiry"></p><small>Never paste this token into GitHub, public websites, or chat. The next step is to import it into your private iPhone Scriptable configuration.</small></div><script>const p=new URLSearchParams(location.hash.slice(1));const q=new URLSearchParams(location.search);const error=p.get('error')||q.get('error');if(error){document.getElementById('status').textContent='Authorization failed: '+error;}else if(p.get('access_token')){document.getElementById('status').textContent='Oura authorization successful.';document.getElementById('result').hidden=false;document.getElementById('token').value=p.get('access_token');const seconds=Number(p.get('expires_in'));if(seconds>0)document.getElementById('expiry').textContent='Expires in approximately '+Math.round(seconds/86400)+' days.';document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('token').value);document.getElementById('copy').textContent='Copied';}catch(e){document.getElementById('token').select();document.getElementById('copy').textContent='Select and copy token';}};}else{document.getElementById('status').textContent='Callback is ready. Return here after authorizing through Oura.';}</script></body></html>
