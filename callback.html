<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oura Authorization</title><style>body{font:17px system-ui;max-width:650px;margin:60px auto;padding:20px;color:#17253b}button{background:#1459aa;color:white;border:0;border-radius:10px;padding:14px 22px;font-size:17px}code{word-break:break-all}small{color:#52647c}</style></head><body><h1>Oura Authorization</h1><p id="status">Checking authorization…</p><div id="result" hidden><p>Authorization succeeded. Your token is sensitive. Copy it only to your private Scriptable configuration, never GitHub or this chat.</p><button id="copy">Copy access token</button><p id="expiry"></p><small>Keep this page private and close it when finished.</small></div><script>
const hash=location.hash.slice(1);history.replaceState(null,'',location.pathname);const p=new URLSearchParams(hash);const expected=sessionStorage.getItem('oura_oauth_state');sessionStorage.removeItem('oura_oauth_state');const status=document.getElementById('status');const token=p.get('access_token');if(p.get('error')){status.textContent='Authorization denied: '+p.get('error');}else if(!expected){status.textContent='No matching authorization session. Open Connect Oura in this browser first.';}else if(expected!==p.get('state')){status.textContent='Security check failed: state mismatch. Please restart authorization.';}else if(!token){status.textContent='No access token received. Please retry from Connect Oura.';}else{status.textContent='Connected successfully.';document.getElementById('result').hidden=false;document.getElementById('expiry').textContent='Token lifetime: '+Math.round(Number(p.get('expires_in')||0)/86400)+' days';document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(token);status.textContent='Token copied. Paste it only into Scriptable on your iPhone.';}catch(e){status.textContent='Clipboard unavailable. Try on Safari or Chrome with clipboard permission.';}};}
</script></body></html>
